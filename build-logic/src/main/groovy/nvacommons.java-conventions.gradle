plugins {
    id 'nva.java-conventions'
}

nva {
    pmd {
        analyzeTests = false
        excludedRules = [
                'AvoidThrowingRawExceptionTypes',
                'GuardLogStatement',
                'UnitTestContainsTooManyAsserts'
        ]
    }
    spotless {
        enabled = true
    }
}

dependencies {
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}
